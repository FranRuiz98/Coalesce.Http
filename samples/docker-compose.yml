name: stampede-http-sample

# ---------------------------------------------------------------------------
# Three clients run the identical image against the identical origin:
#
#   client-a, client-b   Stampede.Http enabled, sharing one Redis cache
#   client-baseline      the same app with the handlers removed — the control group
#
# Everything the dashboards claim is a comparison between those two groups,
# measured at the origin itself.
# ---------------------------------------------------------------------------

x-client-base: &client-base
  build:
    context: ..
    dockerfile: samples/Stampede.Http.Sample.Client/Dockerfile
  volumes:
    # A directory, not a single file: editing a bind-mounted file on the host replaces
    # the inode and the container would keep reading the old one.
    - ./config:/app/config:ro
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 10s
  depends_on:
    api:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: samples/Stampede.Http.Sample.Api/Dockerfile
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    ports:
      - "5080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Runs the narrated feature tour. Exactly one instance may do so: the tour verifies
  # itself against the origin's shared counters, which any other caller would skew.
  client-a:
    <<: *client-base
    hostname: client-a
    environment:
      - Sample__Instance=client-a
      - Sample__Workload__FeatureTour=true
      - Sample__ApiBaseUrl=http://api:8080
      - Sample__RedisConnection=redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      # inotify events do not cross a Docker bind mount on Windows or macOS, so the
      # reloadOnChange watcher over ./config would never fire. Polling does work.
      - DOTNET_USE_POLLING_FILE_WATCHER=true
    ports:
      - "5081:8080"

  client-b:
    <<: *client-base
    hostname: client-b
    environment:
      - Sample__Instance=client-b
      - Sample__Workload__FeatureTour=false
      - Sample__ApiBaseUrl=http://api:8080
      - Sample__RedisConnection=redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      # inotify events do not cross a Docker bind mount on Windows or macOS, so the
      # reloadOnChange watcher over ./config would never fire. Polling does work.
      - DOTNET_USE_POLLING_FILE_WATCHER=true
    ports:
      - "5082:8080"

  # The control group: same code, same Polly pipeline, same workload — no Stampede.Http.
  # Its origin-request rate is the "before" number every claim in the README is measured against.
  client-baseline:
    <<: *client-base
    hostname: client-baseline
    environment:
      - Sample__Instance=client-baseline
      - Sample__Pipeline__Enabled=false
      - Sample__Workload__FeatureTour=false
      - Sample__ApiBaseUrl=http://api:8080
      - Sample__RedisConnection=redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      # inotify events do not cross a Docker bind mount on Windows or macOS, so the
      # reloadOnChange watcher over ./config would never fire. Polling does work.
      - DOTNET_USE_POLLING_FILE_WATCHER=true
    ports:
      - "5083:8080"

  prometheus:
    image: prom/prometheus:v3.13.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - client-a
      - client-b
      - client-baseline

  grafana:
    image: grafana/grafana:13.1.1
    environment:
      # Anonymous admin access — convenience for this local demo only, never do this
      # in a real deployment.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Traces show what counters cannot: one origin span serving a whole burst of callers.
  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"

  # Opt-in load generator: `docker compose --profile load up k6`.
  # Drives real concurrent HTTP traffic into the clients instead of the scripted workload.
  k6:
    image: grafana/k6:0.55.0
    profiles: ["load"]
    volumes:
      - ./load:/scripts:ro
    environment:
      - STAMPEDE_TARGET=http://client-a:8080
      - BASELINE_TARGET=http://client-baseline:8080
    command: ["run", "/scripts/stampede.js"]
    depends_on:
      client-a:
        condition: service_healthy
      client-baseline:
        condition: service_healthy
