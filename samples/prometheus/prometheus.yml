global:
  scrape_interval: 5s
  # Prometheus 3.x negotiates UTF-8 metric names (dots preserved) with targets that
  # support it — the OTel exporter does. Force the classic underscore-escaped scheme
  # so metric names stay predictable (stampede_http_cache_hits_requests_total, not
  # "stampede_http.cache.hits_requests_total").
  metric_name_escaping_scheme: underscores

scrape_configs:
  # The clients expose /metrics on their normal application port — no side-channel
  # listener, no wildcard-binding gymnastics. The `mode` label is what lets a single
  # dashboard query compare Stampede.Http instances against the control group.
  - job_name: stampede-http-clients
    static_configs:
      - targets: ["client-a:8080"]
        labels:
          client: client-a
          mode: stampede
      - targets: ["client-b:8080"]
        labels:
          client: client-b
          mode: stampede
      - targets: ["client-baseline:8080"]
        labels:
          client: client-baseline
          mode: baseline

  # The origin counts what actually reached it, tagged with the X-Client header the
  # clients send. This is the measurement that matters.
  - job_name: sample-api
    static_configs:
      - targets: ["api:8080"]
        labels:
          app: stampede-http-sample
